name: CT Dose Tracker CI

on:
  push:
    branches: [master, "improve/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ct_dose.py dose_metrics.py cli.py agents tests
      - name: Test Python
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check dose.mjs
          node --check app.mjs
      - name: Test browser dose and CSV utilities
        run: node --test dose.test.mjs
